name: CI

# GIGA Standard v5 §Phase 6：CI は pull_request でも動かす。
# push: [main] だけだと、PR の時点で落ちていることに気づけない。
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # 品質ゲートはビルドのあとに走らせる。
      # 初回JS・総アセット・sw.js の版は dist/ を見ないと測れないため。
      - name: Quality gate (GIGA Standard v5)
        run: npm run check

      # 検査そのものが働いていることを、わざと壊して確かめる。
      # 「0件でした」だけでは、効いているのか何も見ていないのか区別できない。
      - name: Verify the quality gate itself
        run: npm run verify-gate
