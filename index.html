<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <!--
    Content Security Policy（GIGA Standard v5 §2-13）

    ⚠️ frame-ancestors はここには書かない。
       <meta> で配ると無視され、読み込みのたびにコンソールへ警告が出るだけになる。
       他サイトへの埋め込みを止めるには HTTP ヘッダーが要るが、
       GitHub Pages では足せない。独自ドメインや CDN を挟むときに設定すること。

    ⚠️ script-src は 'self' のまま。'unsafe-inline' を足すと CSP を入れた意味が
       ほとんど無くなる。インラインの <script> と onclick= は使っていない
       （インストールの合図の捕捉も install-hook.js という外部ファイルにしてある）。

    style-src に 'unsafe-inline' があるのは、React が style 属性で
    幅や高さを渡す箇所があるため。style 属性は 'unsafe-inline' でしか許可できない。

    connect-src は Gemini API の宛先だけを列挙する。
    ここは利用者が URL を入力する作りではないので、列挙しきれる。
    img-src の data: と blob: は、取り込んだ写真を縮めて data URL にして持つため。
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    img-src 'self' data: blob:;
    connect-src 'self' https://generativelanguage.googleapis.com;
    worker-src 'self';
    manifest-src 'self';
    media-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  " />

  <!--
    インストールの合図を「いちばん先に」受け取る。
    Chrome は条件が揃うと即座に beforeinstallprompt を出すため、
    React のバンドルより後だと合図を取りこぼし、
    通信が遅い端末で「インストール」ボタンが出なくなる。
  -->
  <script src="/DigitalCloset/install-hook.js"></script>

  <!-- viewport-fit=cover はノッチ／ホームバー領域まで背景を伸ばすために必須。
       user-scalable=no と maximum-scale は書かない。
       誤ズーム防止の効果より、見えづらい人が拡大できない害のほうが大きい。
       誤ズームは CSS の touch-action で防いである。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <link rel="manifest" href="/DigitalCloset/manifest.webmanifest" />
  <meta name="theme-color" content="#1d4ed8" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="手持ちの服を写真で登録し、コーデ・着用記録・使用頻度をまとめて見渡せる、あなただけのクローゼット帳です。" />

  <link rel="icon" type="image/png" href="/DigitalCloset/favicon.png" />
  <!-- ⚠️ apple-touch-icon には透明を含む画像を指さない。
       iOS は透明部分を黒で埋めるため、ホーム画面でアイコンの四隅だけが黒く出る。
       icon-192.png は角丸の外が透明なので、流用してはいけない。
       tools/build-icons.mjs が透明を落とした専用の 180×180 を作っている。 -->
  <link rel="apple-touch-icon" sizes="180x180" href="/DigitalCloset/icons/apple-touch-icon.png" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ワードローブ" />

  <title>デジタルワードローブ</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
